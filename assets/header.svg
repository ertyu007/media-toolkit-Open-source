<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="ertyu007" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#24242C"/>
    </pattern>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0" stop-color="#F5A524" stop-opacity="0"/>
      <stop offset=".5" stop-color="#F5A524" stop-opacity=".9"/>
      <stop offset="1" stop-color="#F5A524" stop-opacity="0"/>
    </linearGradient>
    <style>
      .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace; }
      .name { font-size: 76px; font-weight: 700; fill: #F4F1EA; }
      .sub  { font-size: 21px; fill: #8E8E9A; }
      .tiny { font-size: 13px; fill: #F5A524; }
      .lab  { font-size: 12px; fill: #6B6B77; }
      .acc  { fill: #F5A524; }
      .in   { opacity: 0; animation: in .7s ease forwards; }
      .cur  { animation: blink 1.1s steps(1) infinite; }
      .scan { animation: scan 2.6s ease-in-out infinite alternate; }
      .draw { stroke-dasharray: 400; animation: draw 4.5s ease-in-out infinite; }
      .bar  { fill: #F5A524; opacity: .9; transform-box: fill-box; transform-origin: center; animation: wave 1.1s ease-in-out infinite; }
      .joint { fill: #F5A524; animation: pulse 2s ease-in-out infinite; }
      .sweep { animation: sweep 5s linear infinite; }
      @keyframes in    { to { opacity: 1; } }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes scan  { from { transform: translateY(0); } to { transform: translateY(132px); } }
      @keyframes draw  { 0% { stroke-dashoffset: 400; } 55%, 85% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -400; } }
      @keyframes wave  { 0%, 100% { transform: scaleY(.15); } 50% { transform: scaleY(1); } }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
      @keyframes sweep { from { transform: translateX(-300px); } to { transform: translateX(1200px); } }
      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; }
        .in { opacity: 1; }
        .draw { stroke-dashoffset: 0; }
      }
    </style>
  </defs>

  <rect width="1200" height="260" rx="14" fill="#0E0E12"/>
  <rect width="1200" height="260" rx="14" fill="url(#dots)"/>
  <rect class="sweep" x="0" y="258" width="300" height="2" fill="url(#fade)"/>

  <!-- left: name -->
  <text x="60" y="72" class="mono sub in" style="animation-delay:.1s">~/ertyu007 <tspan class="acc">$</tspan> ./about</text>
  <text x="60" y="158" class="mono name in" style="animation-delay:.5s">ertyu007<tspan class="acc cur">_</tspan></text>
  <text x="60" y="205" class="mono sub in" style="animation-delay:.9s">code that touches the real world:</text>
  <text x="60" y="232" class="mono sub in" style="animation-delay:1.2s">cameras, mics, sensors, video frames</text>

  <line x1="600" y1="34" x2="600" y2="242" stroke="#24242C"/>
  <line x1="880" y1="34" x2="880" y2="242" stroke="#24242C"/>

  <!-- middle top: manim-style curve being created -->
  <line x1="630" y1="108" x2="840" y2="108" stroke="#2E2E38"/>
  <path class="draw" pathLength="400" d="M630 96 C 668 28, 702 28, 732 76 S 794 124, 840 52" fill="none" stroke="#F5A524" stroke-width="3" stroke-linecap="round"/>
  <text x="630" y="128" class="mono lab">scene.play(Create(curve))</text>

  <!-- middle bottom: voice waveform -->
  <g>
    <rect class="bar" x="634.0" y="172" width="6" height="44" rx="3" style="animation-delay:0.0s"/>
    <rect class="bar" x="646.5" y="172" width="6" height="44" rx="3" style="animation-delay:-1.1s"/>
    <rect class="bar" x="659.0" y="172" width="6" height="44" rx="3" style="animation-delay:-0.9s"/>
    <rect class="bar" x="671.5" y="172" width="6" height="44" rx="3" style="animation-delay:-0.7s"/>
    <rect class="bar" x="684.0" y="172" width="6" height="44" rx="3" style="animation-delay:-0.5s"/>
    <rect class="bar" x="696.5" y="172" width="6" height="44" rx="3" style="animation-delay:-0.3s"/>
    <rect class="bar" x="709.0" y="172" width="6" height="44" rx="3" style="animation-delay:-0.1s"/>
    <rect class="bar" x="721.5" y="172" width="6" height="44" rx="3" style="animation-delay:-1.2s"/>
    <rect class="bar" x="734.0" y="172" width="6" height="44" rx="3" style="animation-delay:-1.0s"/>
    <rect class="bar" x="746.5" y="172" width="6" height="44" rx="3" style="animation-delay:-0.8s"/>
    <rect class="bar" x="759.0" y="172" width="6" height="44" rx="3" style="animation-delay:-0.6s"/>
    <rect class="bar" x="771.5" y="172" width="6" height="44" rx="3" style="animation-delay:-0.4s"/>
    <rect class="bar" x="784.0" y="172" width="6" height="44" rx="3" style="animation-delay:-0.2s"/>
    <rect class="bar" x="796.5" y="172" width="6" height="44" rx="3" style="animation-delay:0.0s"/>
    <rect class="bar" x="809.0" y="172" width="6" height="44" rx="3" style="animation-delay:-1.1s"/>
    <rect class="bar" x="821.5" y="172" width="6" height="44" rx="3" style="animation-delay:-0.9s"/>
  </g>
  <text x="630" y="238" class="mono lab">wake word -&gt; command</text>

  <!-- right: pose viewfinder -->
  <g fill="none" stroke="#F5A524" stroke-width="3" stroke-linecap="square">
    <path d="M900 62 v-28 h28"/>
    <path d="M1140 62 v-28 h-28"/>
    <path d="M900 214 v28 h28"/>
    <path d="M1140 214 v28 h-28"/>
  </g>

  <g stroke="#F4F1EA" stroke-width="2.5" stroke-linecap="round" fill="none" opacity=".85">
    <line x1="1020" y1="94" x2="1020" y2="156"/>
    <line x1="990" y1="104" x2="1050" y2="104"/>
    <line x1="1006" y1="156" x2="1034" y2="156"/>
    <polyline points="1006,156 1002,184 1000,210"/>
    <polyline points="1034,156 1038,184 1040,210"/>
    <polyline points="990,104 978,130 974,154"/>
    <line x1="1050" y1="104" x2="1062" y2="130"/>
  </g>
  <circle cx="1020" cy="82" r="11" fill="none" stroke="#F4F1EA" stroke-width="2.5" opacity=".85"/>

  <g class="joint">
    <circle cx="990" cy="104" r="3.5"/><circle cx="1050" cy="104" r="3.5"/>
    <circle cx="1006" cy="156" r="3.5"/><circle cx="1034" cy="156" r="3.5"/>
    <circle cx="1002" cy="184" r="3.5"/><circle cx="1038" cy="184" r="3.5"/>
    <circle cx="1000" cy="210" r="3.5"/><circle cx="1040" cy="210" r="3.5"/>
    <circle cx="978" cy="130" r="3.5"/><circle cx="974" cy="154" r="3.5"/>
    <circle cx="1062" cy="130" r="3.5"/>
  </g>

  <!-- curling forearm -->
  <g>
    <line x1="1062" y1="130" x2="1062" y2="156" stroke="#F4F1EA" stroke-width="2.5" stroke-linecap="round" opacity=".85"/>
    <circle cx="1062" cy="156" r="3.5" fill="#F5A524"/>
    <animateTransform attributeName="transform" type="rotate" calcMode="spline"
      values="0 1062 130;150 1062 130;0 1062 130" keyTimes="0;0.5;1" keySplines=".45 0 .55 1;.45 0 .55 1" dur="2s" repeatCount="indefinite"/>
  </g>

  <rect class="scan" x="912" y="72" width="216" height="2" fill="#F5A524" opacity=".8"/>
  <text x="914" y="58" class="mono tiny">pose: 33 landmarks</text>
  <text x="1126" y="236" text-anchor="end" class="mono tiny" opacity="1">reps: 01<animate attributeName="opacity" calcMode="discrete" values="1;0;0;0" keyTimes="0;0.25;0.5;0.75" dur="8s" repeatCount="indefinite"/></text>
  <text x="1126" y="236" text-anchor="end" class="mono tiny" opacity="0">reps: 02<animate attributeName="opacity" calcMode="discrete" values="0;1;0;0" keyTimes="0;0.25;0.5;0.75" dur="8s" repeatCount="indefinite"/></text>
  <text x="1126" y="236" text-anchor="end" class="mono tiny" opacity="0">reps: 03<animate attributeName="opacity" calcMode="discrete" values="0;0;1;0" keyTimes="0;0.25;0.5;0.75" dur="8s" repeatCount="indefinite"/></text>
  <text x="1126" y="236" text-anchor="end" class="mono tiny" opacity="0">reps: 04<animate attributeName="opacity" calcMode="discrete" values="0;0;0;1" keyTimes="0;0.25;0.5;0.75" dur="8s" repeatCount="indefinite"/></text>
</svg>
