name: build-android

on:
  push:
    tags: ['android-v*']
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install system deps (p4a host builds)
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool libltdl-dev pkg-config \
            zlib1g-dev libncurses-dev cmake \
            libffi-dev libssl-dev

      - name: Install buildozer
        run: python -m pip install --upgrade buildozer cython==0.29.36

      - name: Cache p4a dists
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle
            android/.buildozer
          key: p4a-${{ hashFiles('android/buildozer.spec') }}
          restore-keys: p4a-

      - name: Build debug APK
        working-directory: android
        run: |
          yes | buildozer -v android debug
          ls -la bin/

      - name: Unit tests (full suite)
        run: |
          python -m compileall -q app.py clipora tests scripts android
          python -W error::ResourceWarning -m unittest discover -s tests

      - uses: actions/upload-artifact@v4
        with:
          name: clipora-debug-apk
          path: android/bin/*.apk
          if-no-files-found: error
