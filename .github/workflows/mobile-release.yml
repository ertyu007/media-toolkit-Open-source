name: Build Mobile release

on:
  workflow_dispatch:
  push:
    tags: ['mobile-v*']

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter pub get
        run: flutter pub get
      - name: Flutter analyze
        run: flutter analyze
      - name: Flutter test
        run: flutter test
      - name: Build release APKs
        run: flutter build apk --release --split-per-abi
      - name: Compute version and checksum
        id: version
        shell: bash
        run: |
          version=$(sed -n 's/^version:[[:space:]]*\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)[+][0-9][0-9]*.*/\1/p' pubspec.yaml)
          if [ -z "$version" ]; then
            echo "Could not parse version from pubspec.yaml" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          apk="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          if [ ! -f "$apk" ]; then
            echo "Missing APK: $apk" >&2
            exit 1
          fi
          sha256sum "$apk" | tee "app-arm64-v8a-release.apk.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: Clipora-Android-arm64-v8a
          path: |
            mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            mobile/app-arm64-v8a-release.apk.sha256
          if-no-files-found: error
      - name: Publish mobile release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ steps.version.outputs.version }}"
          releaseTag="mobile-v$version"
          gh release view "$releaseTag" 2>/dev/null || gh release create "$releaseTag" --title "Clipora Android v$version" --generate-notes
          gh release upload "$releaseTag" build/app/outputs/flutter-apk/app-arm64-v8a-release.apk app-arm64-v8a-release.apk.sha256 --clobber
