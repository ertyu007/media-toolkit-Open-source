name: Build Windows release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
      CLIPORA_AZURE_ACCOUNT_URI: ${{ secrets.CLIPORA_AZURE_ACCOUNT_URI }}
      CLIPORA_AZURE_CLIENT_ID: ${{ secrets.CLIPORA_AZURE_CLIENT_ID }}
      CLIPORA_AZURE_CLIENT_SECRET: ${{ secrets.CLIPORA_AZURE_CLIENT_SECRET }}
      CLIPORA_AZURE_TENANT: ${{ secrets.CLIPORA_AZURE_TENANT }}
      CLIPORA_AZURE_CERT_PROFILE: ${{ secrets.CLIPORA_AZURE_CERT_PROFILE }}
      CLIPORA_AZURE_CERT_NAME: ${{ secrets.CLIPORA_AZURE_CERT_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-dev.txt
      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Generate application icon
        run: python scripts/generate_icon.py
      - name: Build Clipora application
        run: python -m PyInstaller --noconfirm --clean packaging/clipora.spec
      - name: Stage bundled tools for offline installer
        run: python scripts/stage_bundled_tools.py --dest dist/Clipora/tools
      - name: Decode code-signing certificate
        if: ${{ env.SIGN_CERT_BASE64 != '' }}
        shell: pwsh
        env:
          SIGN_CERT_BASE64: ${{ secrets.CLIPORA_CERT_BASE64 }}
          SIGN_CERT_PASSWORD: ${{ secrets.CLIPORA_CERT_PASSWORD }}
        run: |
          $cert = Join-Path $env:RUNNER_TEMP 'clipora.pfx'
          [IO.File]::WriteAllBytes($cert, [Convert]::FromBase64String($env:SIGN_CERT_BASE64))
          "CLIPORA_CERT_PATH=$cert" | Out-File -FilePath $env:GITHUB_ENV -Append
          if ($env:SIGN_CERT_PASSWORD) {
            "CLIPORA_CERT_PASSWORD=$env:SIGN_CERT_PASSWORD" | Out-File -FilePath $env:GITHUB_ENV -Append
          }
      - name: Sign Clipora executable
        shell: pwsh
        run: |
          & scripts/sign_windows.ps1 -Path "dist\Clipora\Clipora.exe" -Description 'Clipora desktop media toolkit' -Url 'https://github.com/ertyu007/media-toolkit-Open-source'
          if ($LASTEXITCODE -ne 0) { throw "Signing Clipora.exe failed: $LASTEXITCODE" }
      - name: Install Inno Setup
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
          Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $installer
          $header = [IO.File]::ReadAllBytes($installer)
          if (-not ($header.Length -gt 1 -and $header[0] -eq 0x4D -and $header[1] -eq 0x5A)) {
            throw 'Downloaded Inno Setup installer is not a valid executable'
          }
          Start-Process -FilePath $installer -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-' -Wait
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc)) { throw "ISCC.exe not found after install: $iscc" }
      - name: Build installer, sign and checksum
        shell: pwsh
        run: |
          $version = python -c 'from clipora import __version__; print(__version__)'
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          & $iscc "/DAppVersion=$version" packaging/clipora.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed: $LASTEXITCODE" }
          $installer = "dist\installer\Clipora-Setup-$version-x64.exe"
          & scripts/sign_windows.ps1 -Path $installer -Description 'Clipora Setup' -Url 'https://github.com/ertyu007/media-toolkit-Open-source'
          if ($LASTEXITCODE -ne 0) { throw "Signing installer failed: $LASTEXITCODE" }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer).Hash.ToLowerInvariant()
          Set-Content -LiteralPath "$installer.sha256" -Value "$hash  $(Split-Path -Leaf $installer)" -Encoding ascii
      - name: Package portable ZIP
        shell: pwsh
        run: |
          $version = python -c 'from clipora import __version__; print(__version__)'
          $zip = "dist\Clipora-$version-x64.zip"
          Compress-Archive -Path dist\Clipora\* -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          Set-Content -LiteralPath "$zip.sha256" -Value "$hash  $(Split-Path -Leaf $zip)" -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: Clipora-Windows
          path: |
            dist/installer/Clipora-Setup-*-x64.exe
            dist/installer/Clipora-Setup-*-x64.exe.sha256
            dist/Clipora-*-x64.zip
            dist/Clipora-*-x64.zip.sha256
          if-no-files-found: error
      - name: Publish GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # อัปโหลด assets ของ PC ไปที่ release ของเวอร์ชัน PC เสมอ (v<__version__>)
          # ไม่ใช่ tag ที่ trigger งานนี้ เพราะ tag v1.0.1 เป็นของแอปมือถือแล้ว
          $version = python -c 'from clipora import __version__; print(__version__)'
          $releaseTag = "v$version"
          gh release view $releaseTag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $releaseTag --title "Clipora PC $releaseTag" --generate-notes
          }
          gh release upload $releaseTag dist/installer/Clipora-Setup-*-x64.exe dist/installer/Clipora-Setup-*-x64.exe.sha256 dist/Clipora-*-x64.zip dist/Clipora-*-x64.zip.sha256 --clobber
