name: Build Windows release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-dev.txt
      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Generate application icon
        run: python scripts/generate_icon.py
      - name: Build Clipora application
        run: python -m PyInstaller --noconfirm --clean packaging/clipora.spec
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer and checksum
        shell: pwsh
        run: |
          $version = python -c 'from clipora import __version__; print(__version__)'
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          & $iscc "/DAppVersion=$version" packaging/clipora.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed: $LASTEXITCODE" }
          $installer = "dist\installer\Clipora-Setup-$version-x64.exe"
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer).Hash.ToLowerInvariant()
          Set-Content -LiteralPath "$installer.sha256" -Value "$hash  $(Split-Path -Leaf $installer)" -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: Clipora-Windows
          path: |
            dist/installer/Clipora-Setup-*-x64.exe
            dist/installer/Clipora-Setup-*-x64.exe.sha256
          if-no-files-found: error
      - name: Publish GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = '${{ github.ref_name }}'
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "Clipora $tag" --generate-notes
          }
          gh release upload $tag dist/installer/Clipora-Setup-*-x64.exe dist/installer/Clipora-Setup-*-x64.exe.sha256 --clobber
